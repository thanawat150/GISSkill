name: Temporary Sentinel 2022 Worker

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.event.issue.title, '[GEOAI-S2-2022]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Earth Search STAC for 13-STC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > out/query.json <<'JSON'
          {
            "collections": ["sentinel-2-l2a"],
            "bbox": [101.6878800925052, 12.70546012035511, 101.6974598979201, 12.71493844822151],
            "datetime": "2022-01-01T00:00:00Z/2022-08-31T23:59:59Z",
            "limit": 20,
            "sortby": [{"field": "properties.datetime", "direction": "asc"}]
          }
          JSON
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data @out/query.json \
            'https://earth-search.aws.element84.com/v1/search' > out/results.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('out/results.json').read_text(encoding='utf-8'))
          feats = data.get('features', [])
          summary = []
          for f in feats:
              summary.append({
                  'id': f.get('id'),
                  'datetime': f.get('properties', {}).get('datetime'),
                  'cloud_cover': f.get('properties', {}).get('eo:cloud_cover'),
                  'mgrs_tile': f.get('properties', {}).get('mgrs:tile'),
                  'assets': sorted(f.get('assets', {}).keys()),
              })
          Path('out/summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(f'features={len(feats)}')
          if not feats:
              raise SystemExit('No Sentinel-2 L2A items returned')
          for row in summary[:10]:
              print(row)
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-2022-probe
          path: out/
          retention-days: 3
